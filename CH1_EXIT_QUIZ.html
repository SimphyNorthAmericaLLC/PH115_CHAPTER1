<style>
body{font-family:system-ui,sans-serif;line-height:1.45;margin:0;padding:24px;background:radial-gradient(circle at top,#1b2745,#090a0f);color:#f2f2f2}
#quiz2{max-width:760px;margin:auto;background:#121212;border:1px solid #2c2c2c;border-radius:18px;padding:24px;box-shadow:0 0 25px rgba(0,0,0,.4)}
.quiz-header{text-align:center;margin-bottom:18px}.subtitle{color:#9fdcff}
.progress-wrap{width:100%;height:10px;background:#222;border-radius:20px;overflow:hidden;margin-bottom:18px}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ff99)}
#q2_stem{margin:.8rem 0 1rem;font-size:1.08rem;font-weight:500}
button{border:1px solid #333;border-radius:12px;padding:14px;background:#181818;color:#f2f2f2;cursor:pointer;text-align:left;font:inherit}
button:hover{border-color:#00d4ff}.correct{color:#00ff88}.incorrect{color:#ff6666}
</style>
<div id="quiz2"><div class="quiz-header"><h1>PH115 Exit Quiz</h1><div class="subtitle">Electric Fields</div></div><div class="progress-wrap"><div id="progress-bar"></div></div>
  <h3 id="q2_progress"></h3>
  <div id="q2_stem" style="margin:.5rem 0 1rem"></div>
  <div id="q2_options"></div>
  <div id="q2_feedback" style="margin-top:.75rem"></div>
  <button id="q2_restart" style="display:none;margin-top:1rem">Restart</button>
</div>

<script>
(() => {
  // Same engine, new dataset
  const QUESTIONS = [
    {
      original: "We place several negative charges right at the center of a conductor. As a result, after equilibrium has been reached, the electric field inside the conductor will be:",
      choices: ["proportional to the charge we placed","reversely proportional to the charge we placed","none of these"],
      correctIndex: 2
    },
    {
      original: "Gauss’s law for electricity:",
      choices: ["is not always accurate and it depends on the implemented distance","always holds true"],
      correctIndex: 1
    },
    {
      original: "Gauss’s law for electricity is:",
      choices: ["a vector equation","a scalar equation","none of these"],
      correctIndex: 1
    },
    {
      original: "Gauss’s law for electricity is valid:",
      choices: ["for a spherical surface","for a cylindrical surface","spherical or cylindrical surfaces","for all surfaces of any shape"],
      correctIndex: 3
    },
    {
      original: "The electric field inside a charged conductor when equilibrium has been reached is always:",
      choices: ["zero","non-zero","it can be both, depending on the charge"],
      correctIndex: 0
    },
    {
      original: "The electric potential inside a charged conductor when equilibrium has been reached is always:",
      choices: ["zero","non-zero","it can be both, depending on the charge"],
      correctIndex: 1
    },
    {
      original: "The electric field inside a charged insulator when equilibrium has been reached is always:",
      choices: ["zero","non-zero","it can be both, depending on the charge density"],
      correctIndex: 2
    },
    {
      original: "The electric potential inside a charged insulator is always:",
      choices: ["zero","non-zero","it can be both, depending on the charge"],
      correctIndex: 2
    },
    {
      original: "The word electron means:",
      choices: ["something round and very small","something round, very small that has charge","amber","none of these"],
      correctIndex: 2
    },
    {
      original: "The Coulomb constant is:",
      choices: ["the same across all media","highly depends on the medium"],
      correctIndex: 1
    },
    {
      original: "The first information regarding the charge of the electron was provided by:",
      choices: ["Albert Einstein","Michael Faraday","Nicolai Tesla","Millikan and Fletcher"],
      correctIndex: 3
    },
    {
      original: "A charged droplet can have the following total charge:",
      choices: ["3.7 x 10^-19 C","16 x 10^-19 C","3.4 x 10^-19 C","all of these","none of these"],
      correctIndex: 1
    },
    {
      original: "An electron-volt is a unit for:",
      choices: ["charge","energy","power","none of these"],
      correctIndex: 1
    },
    {
      original: "What keeps an electron of an atom from coming crashing down to the positive nucleus is: ",
      choices: ["the Coulomb forces","the limitations imposed by quantum physics","the limitations imposed by the speed of light","none of these"],
      correctIndex: 1
    },
    {
      original: "If an electron is placed inside a uniform electric field, then it will always move towards: ",
      choices: ["lower electric potential energy","higher electric potential energy","none of these"],
      correctIndex: 0
    },
    {
      original: "If a proton is placed inside a uniform electric field, then it will always move towards:",
      choices: ["lower electric potential energy","higher electric potential energy","none of these"],
      correctIndex: 0
    },
    {
      original: "If a charge is placed along an equipotential “surface,” then one thing that may happen is:",
      choices: ["accelerate","decelerate","stay put"],
      correctIndex: 2
    },
    {
      original: "If we made an analogy between electrons and planets, then the electrons that reside in the outer shell of an atom have:",
      choices: ["more potential and less kinetic energy","less potential and more kinetic energy","none of these apply"],
      correctIndex: 0
    },
    {
      original: "When observing the two ends of a discharge from a VDG, then typically if the brighter side is towards the charge collector, then the VDG is charged",
      choices: ["negative","positively","there is no difference in the brightness"],
      correctIndex: 0
    },
    {
      original: "Humidity in the air will typically cause ",
      choices: ["higher breakdown voltage","lower breakdown voltage","will make no difference"],
      correctIndex: 0
    },
    {
      original: "In low pressure conditions, an electric discharge would typically appear",
      choices: ["brighter","dimmer","no effect on the brightness"],
      correctIndex: 1
    },
    {
      original: "In low pressure conditions, an electric discharge would typically appear to be",
      choices: ["straighter","more zigzag","no effect on the shape"],
      correctIndex: 0
    },
    {
      original: "When sometimes you reach for the doorknob and it shows you that this discharge is of the order of",
      choices: ["thousands of volts","hundreds of volts","a couple of volts"],
      correctIndex: 0
    },
    {
      original: "The electric field from a spherical VDG reduces outside the sphere as a function of distance following ",
      choices: ["1/r","1/r^2","1/r^3"],
      correctIndex: 1
    },
    {
      original: "When the electric field strength exceeds about three million volts per meter, then the air ",
      choices: ["becomes a bad conductor of electricity","the number of free electrons in the air is greatly increased","all of these","none of these"],
      correctIndex: 1
    },
    {
      original: "The air under normal conditions is ",
      choices: ["a good conductor of electricity","a bad conductor of electricity"],
      correctIndex: 1
    },
    {
      original: "The sound we hear during a VDG sparking is because ",
      choices: ["air expands from the sudden heating","the collision between the electrons and the atoms","circuit cracking inside the VDG","none of these"],
      correctIndex: 0
    },
    {
      original: "The resultant polarity of the triboelectrict phenomenon can happen between",
      choices: ["a specific combination of materials","any materials"],
      correctIndex: 0
    }
  ];

  const letters = "abcdefghijklmnopqrstuvwxyz".split("");

  function stemFrom(original){
    const i = original.indexOf("a)");
    return (i === -1) ? original : original.slice(0, i).replace(/[ ;:,.]+$/,"");
  }

  function runQuiz(){
    let index = 0, score = 0;
    const shuffledQuestions = [...QUESTIONS];
    for(let i = shuffledQuestions.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledQuestions[i], shuffledQuestions[j]] = [shuffledQuestions[j], shuffledQuestions[i]];
    }
    const root = document.getElementById("quiz2");
    const progress = document.getElementById("q2_progress");
    const stem = document.getElementById("q2_stem");
    const options = document.getElementById("q2_options");
    const feedback = document.getElementById("q2_feedback");
    const restartBtn = document.getElementById("q2_restart");
    restartBtn.style.display = "none";

    function render(){
      const total = shuffledQuestions.length;
      const q = shuffledQuestions[index];
      progress.textContent=`Question ${index+1} of ${total} · Score: ${score}/${total}`;document.getElementById("progress-bar").style.width=((index)/shuffledQuestions.length*100)+"%";
      stem.textContent = stemFrom(q.original);
      options.innerHTML = "";
      feedback.textContent="";feedback.className="";
      q.choices.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.textContent = ` ${letters[i]}) ${text}`;
        btn.style.display = "block";
        btn.style.margin = ".25rem 0";
        btn.onclick = () => select(i);
        options.appendChild(btn);
      });
    }

    function select(i){
      const q = shuffledQuestions[index];
      if(i !== q.correctIndex){
        // restart behavior
        progress.textContent = "";
        stem.textContent = "";
        options.innerHTML = "";
        feedback.className="incorrect";feedback.textContent="Incorrect — restarting from Question 1…";
        restartBtn.style.display = "inline-block";
        restartBtn.onclick = () => runQuiz();
        return;
      }
      score++;
      feedback.className="correct";feedback.textContent="Correct!";
      index++;
      if(index < shuffledQuestions.length){
        setTimeout(render, 400);
      }else{
        setTimeout(() => {
          progress.textContent = "";
          stem.textContent = "";
          options.innerHTML = "";
          feedback.innerHTML = `✅ Perfect! You answered all questions correctly.<br>Score: ${score}/${shuffledQuestions.length}`;
          try { localStorage.setItem("quiz2Score", JSON.stringify({score, total: shuffledQuestions.length, ts: Date.now()})); } catch(e){}
          restartBtn.style.display = "inline-block";
          restartBtn.textContent = "Restart";
          restartBtn.onclick = () => runQuiz();
        }, 300);
      }
    }

    render();
  }

  runQuiz();
})();
</script>
